# Unit tests on every push. The integration suite needs a live HydraDB, which
# the blast-radius workflow already stands up — these are the tests that need
# nothing but Node, so they stay fast and always run.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        # @blast/cli and @blast/dashboard import @blast/core by its package name,
        # which resolves to packages/core/dist. So core has to be *emitted*
        # first — typechecking it with --noEmit leaves no declarations behind and
        # every downstream import fails with TS2307, taking a cascade of
        # implicit-any errors with it.
        run: |
          npx tsc -p packages/core/tsconfig.json
          npx tsc -p packages/cli/tsconfig.json --noEmit
          npx tsc -p packages/dashboard/tsconfig.json --noEmit
      - name: Unit tests
        run: npx vitest run tests/unit
      - name: No mocks, stubs or placeholders in shipped source
        run: |
          # `placeholder` is also real API surface — the HTML input attribute and
          # the CSS `::placeholder` pseudo-element — so those spellings are
          # excluded by shape rather than by weakening the rule itself.
          if grep -rniE '\b(todo|fixme|mock|stub|dummy|fake|placeholder)\b' \
               packages/core/src packages/cli/src packages/dashboard/src bin \
             | grep -viE 'placeholder="|placeholder=\{|::placeholder|::-webkit-input-placeholder|non-placeholder characters|not yet implemented by LocalFileSystem|does not implement them'; then
            echo "::error::forbidden marker found in shipped source"
            exit 1
          fi
          echo "clean"
