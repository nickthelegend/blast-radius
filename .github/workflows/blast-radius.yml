# Gate a pull request on supply-chain blast radius.
#
# Stands up HydraDB and its object store through the repository's own compose
# file, loads the committed graph, scans this repository's actual lockfile into
# it, and checks whether any compromised version is reachable from what the PR
# would ship.
#
# The gate distinguishes "found something" (exit 1, fail the build) from "could
# not run the check" (exit 2, something is wrong with the infrastructure) — a
# scanner that cannot run should never silently pass. Both outcomes are asserted
# below, so this job is green when the gate is behaving and red when it is not.

name: blast radius

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Required to upload SARIF to the code-scanning API.
  security-events: write

jobs:
  supply-chain-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The stack comes up through the repository's own docker-compose.yml rather
    # than through `services:`. Service containers cannot express what this
    # engine needs — a bucket created before first write, and a cache directory
    # chowned to uid 10001 before the node starts, both of which compose models
    # as init containers with `depends_on: service_completed_successfully`. It
    # also means CI exercises the exact command the README tells a reader to run.

    env:
      HYDRA_HTTP_URL: http://127.0.0.1:8443
      HYDRA_ADMIN_URL: http://127.0.0.1:9090
      HYDRA_AUTH_TOKEN: local-development-token-32-bytes

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npx tsc -p packages/core/tsconfig.json
          npx tsc -p packages/cli/tsconfig.json

      - name: Start HydraDB and its object store
        run: docker compose up -d --wait minio-init hydradb-init hydradb

      - name: Wait for HydraDB
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$HYDRA_ADMIN_URL/readyz"; then
              echo "HydraDB ready"; exit 0
            fi
            sleep 2
          done
          echo "HydraDB never became ready"; exit 1

      - name: Load the dependency graph
        run: ./bin/blastradius load

      - name: Verify every engine capability the gate relies on
        run: ./bin/blastradius doctor

      - name: Scan this repository's lockfile
        run: ./bin/blastradius scan . --name "${GITHUB_REPOSITORY##*/}"

      # The gate is asserted in both directions, because a supply-chain check
      # that cannot fail is worth nothing and one that cannot pass is worth
      # less. Nothing is compromised yet, so this must exit 0.
      - name: Gate — clean tree must pass
        run: |
          set +e
          ./bin/blastradius ci --repo "${GITHUB_REPOSITORY##*/}"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::gate returned $code on a clean tree; expected 0"
            exit 1
          fi
          echo "clean tree → exit 0"

      - name: Arm the known incident
        run: ./bin/blastradius arm

      # Now debug@4.4.3 is compromised and this repository resolves it through
      # vitest. The gate must find it and exit 1. Anything else — including a
      # pass — is a failure of the gate itself.
      - name: Gate — armed incident must be caught
        id: gate
        run: |
          set +e
          ./bin/blastradius ci --repo "${GITHUB_REPOSITORY##*/}" --sarif blast-radius.sarif.json | tee gate.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### Supply-chain gate"
            echo
            echo '```'
            cat gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 1 ]; then
            echo "::error::gate returned $code against an armed incident; expected 1"
            exit 1
          fi
          echo "armed incident → exit 1, caught"

      # These run whether the gate passed or failed — but only once the gate has
      # actually run. Guarding on `always()` alone means that when the engine
      # fails to start, every remaining step also fails with "no such file",
      # burying the one error that matters under four that don't.
      - name: Export SBOM
        if: always() && steps.gate.conclusion != 'skipped'
        run: ./bin/blastradius sbom "${GITHUB_REPOSITORY##*/}" --out sbom.cdx.json

      - name: Incident report
        if: always() && steps.gate.outputs.exit == '1'
        run: |
          ./bin/blastradius report "$(./bin/blastradius incident --key)" --out incident.md
          cat incident.md >> "$GITHUB_STEP_SUMMARY"

      # The findings land in the repository's Security tab, annotate the pull
      # request, and close themselves when the exposure clears — the stable
      # partialFingerprints are what makes that last part work.
      - name: Upload findings to code scanning
        if: always() && hashFiles('blast-radius.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: blast-radius.sarif.json
          category: blast-radius

      - name: Engine logs
        if: failure()
        run: docker compose logs --tail 200 hydradb minio

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: supply-chain-artifacts
          path: |
            sbom.cdx.json
            incident.md
            blast-radius.sarif.json
          if-no-files-found: ignore
